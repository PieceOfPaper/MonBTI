name: 시트 데이터 갱신

on:
  workflow_dispatch:

permissions:
  contents: read

# 일반 Pages 배포와 같은 그룹에서 실행해 배포가 겹치지 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # 배포 워크플로 실행 요청에 필요하다.
      actions: write
    steps:
      - name: main 브랜치 실행 확인
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Run workflow에서 main 브랜치를 선택하세요."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 최신 시트 검증 및 JSON 변환
        run: npm run data:convert -- --if-changed
      - run: npm test
      - run: npm run build
      - name: 데이터 변경만 커밋
        run: |
          git add -- src/data/wilds/weapons.json src/data/wilds/questions.json
          if git diff --cached --quiet; then
            echo "데이터 변경이 없습니다. 현재 데이터로 다시 배포합니다." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '시트의 최신 무기·질문 데이터 반영'
            git push origin HEAD:main
            echo "최신 시트 데이터 두 파일을 main에 반영했습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
      # 이 실행에서 직접 배포하면 Pages 배포 버전이 데이터 커밋이 아니라 실행을 시작한 커밋이 되어,
      # 같은 커밋의 푸시 배포와 겹치면 새 데이터가 반영되지 않을 수 있다.
      # 일반 배포 워크플로를 최신 main으로 실행해 데이터 커밋 기준으로 배포한다.
      # GITHUB_TOKEN으로도 workflow_dispatch는 실행할 수 있고, 같은 pages 그룹이라 이 실행이 끝난 뒤 시작한다.
      - name: 최신 main으로 Pages 배포 실행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "[Deploy GitHub Pages](https://github.com/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml) 실행을 요청했습니다. 배포 결과는 해당 실행에서 확인하세요." >> "$GITHUB_STEP_SUMMARY"
